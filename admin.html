<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMM Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:24px}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:22px;margin:16px 0}h1,h2{margin-top:0}.muted{color:#999;font-size:13px}input,textarea{width:100%;background:#090909;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;margin:7px 0 14px}button{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.danger{background:#4a1616}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.svc{border:1px solid #292929;border-radius:14px;padding:15px;margin:10px 0}.svcTop{display:flex;justify-content:space-between;gap:10px}.tag{font-size:10px;padding:5px 8px;border-radius:99px;background:#163a24;color:#80e8a3}.off{background:#333;color:#aaa}.msg{padding:12px;border-radius:10px;margin:12px 0;display:none}.ok{background:#12351f;color:#91f0ae}.err{background:#421717;color:#ff9999}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div id="login" class="card" style="max-width:420px;margin:70px auto"><h1>Admin Login</h1><p class="muted">Vercel SMM Combo Manager</p><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Login</button><div id="loginMsg" class="msg err"></div></div>
<div id="app" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>SMM Admin</h1><div class="muted">Manage services, pricing and MrSMM settings.</div></div><button onclick="logout()">Logout</button></div>
<div id="msg" class="msg"></div>
<div class="card"><h2>MrSMM API</h2><div class="row"><div><label>API Endpoint</label><input id="apiUrl"></div><div><label>API Key</label><input id="apiKey" type="password" placeholder="Enter new key"></div></div><button onclick="saveSettings()">Save API Settings</button></div>
<div class="card"><h2>Add / Edit Service</h2><div class="row"><div><label>Service ID</label><input id="sid" placeholder="e.g. 1234"></div><div><label>Service Name</label><input id="sname" placeholder="Instagram Growth Combo"></div></div><div class="row"><div><label>Price</label><input id="price" placeholder="₹99"></div><div><label>Description</label><input id="desc" placeholder="Fast growth package"></div></div><label>Details (one per line)</label><textarea id="details" rows="5" placeholder="10,000 Views&#10;500 Likes&#10;1,000 Shares"></textarea><label><input id="active" type="checkbox" checked style="width:auto"> Active</label><br><br><button onclick="saveService()">Save Service</button></div>
<div class="card"><h2>Services</h2><div id="services"></div></div>
</div></div>
<script>
let pw=sessionStorage.getItem('smm_admin_pw')||'';
const H=()=>({'Content-Type':'application/json','x-admin-password':pw});
function show(el,text,ok=false){el.textContent=text;el.className='msg '+(ok?'ok':'err');el.style.display='block'}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':pw};let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){pw=document.getElementById('pw').value;try{await api('/api/admin-settings');sessionStorage.setItem('smm_admin_pw',pw);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}catch(e){show(document.getElementById('loginMsg'),e.message)}}
function logout(){sessionStorage.removeItem('smm_admin_pw');location.reload()}
async function load(){const s=await api('/api/admin-settings');document.getElementById('apiUrl').value=s.apiUrl;loadServices()}
async function loadServices(){const a=await api('/api/admin-services');document.getElementById('services').innerHTML=a.map(s=>`<div class="svc"><div class="svcTop"><div><b>${esc(s.name)}</b><div class="muted">ID: ${esc(s.id)} · ${esc(s.price)}</div><div class="muted">${esc(s.details).replace(/\n/g,'<br>')}</div></div><div><span class="tag ${s.active?'':'off'}">${s.active?'ACTIVE':'OFF'}</span><br><br><button class="danger" onclick="del('${esc(s.id)}')">Delete</button></div></div></div>`).join('')||'<p class="muted">No services yet.</p>'}
async function saveSettings(){try{await api('/api/admin-settings',{method:'POST',body:JSON.stringify({apiUrl:document.getElementById('apiUrl').value,apiKey:document.getElementById('apiKey').value})});document.getElementById('apiKey').value='';show(document.getElementById('msg'),'API settings saved.',true)}catch(e){show(document.getElementById('msg'),e.message)}}
async function saveService(){const s={id:document.getElementById('sid').value,name:document.getElementById('sname').value,price:document.getElementById('price').value,description:document.getElementById('desc').value,details:document.getElementById('details').value,active:document.getElementById('active').checked};try{await api('/api/admin-services',{method:'POST',body:JSON.stringify(s)});show(document.getElementById('msg'),'Service saved.',true);loadServices();document.getElementById('sid').value='';document.getElementById('sname').value='';document.getElementById('price').value='';document.getElementById('desc').value='';document.getElementById('details').value=''}catch(e){show(document.getElementById('msg'),e.message)}}
async function del(id){if(!confirm('Delete this service?'))return;try{await api('/api/admin-services?id='+encodeURIComponent(id),{method:'DELETE'});loadServices()}catch(e){show(document.getElementById('msg'),e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
if(pw){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load().catch(()=>logout())}
</script></body></html>
